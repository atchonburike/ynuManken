    <style>
        #creaters .createricon {
            position: absolute; 
            mask-image: url("image/mask_cir.png");
            mask-repeat: no-repeat;
            mask-position: 3% 0;
            mask-size: auto 100%;
            -webkit-mask-image: url("image/mask_cir.png");
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: 3% 0;
            -webkit-mask-size: auto 100%;
        }
        #creaters .createricon-select {
            position: absolute;
            mask-image: url("image/mask_cir_select.png");
            mask-repeat: no-repeat;
            mask-position: 3% 0;
            mask-size: auto 100%;
            -webkit-mask-image: url("image/mask_cir_select.png");
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: 3% 0;
            -webkit-mask-size: auto 100%;
        }
    </style>
    <script>
        var selectcreater = 0;
        var selectpage = 0;
        
        const createricon0 = document.getElementById("creaters-icon-top");
        const createricon1 = document.getElementById("creaters-icon-center");
        const createricon2 = document.getElementById("creaters-icon-bottom");

        const icon0 = document.getElementById("createricon1-select");
        const iconno0 = document.getElementById("createricon1-noselect");

        createricon0.addEventListener('click',function(){
            icon0.style.display = 'block';
            iconno0.style.display = 'none';
            createricon0.style.pointer-events = 'none';
            if(selectcreater === 1){
                createricon1.style.pointer-events = 'auto';
            }
            else{
                createricon2.style.pointer-events = 'auto';
            }
            selectcreater = 0;
        });

        createricon1.addEventListener('click',function(){
            createricon1.style.pointer-events = 'none';
            if(selectcreater === 0){
                icon0.style.display = 'none';
                iconno0.style.display = 'block';
                createricon0.style.pointer-events = 'auto';
            }
            else{
                createricon2.style.pointer-events = 'auto';
            }
            selectcreater = 1;
        });

        createricon2.addEventListener('click',function(){
        });
    </script>
    <style>
